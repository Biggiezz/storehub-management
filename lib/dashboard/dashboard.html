<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoreHub Admin - Bảng điều khiển</title>
    <!-- Nhúng hệ thống CSS dùng chung -->
    <link rel="stylesheet" href="../common/common.css" />
    <style>
      /* 4 Stat KPI Cards */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.25rem;
        margin-bottom: 2rem;
      }

      .kpi-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        box-shadow: var(--shadow-xs);
        transition:
          transform var(--transition-fast),
          box-shadow var(--transition-fast);
        position: relative;
        overflow: hidden;
      }

      .kpi-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .kpi-info {
        flex: 1;
      }

      .kpi-title {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
      }

      .kpi-value {
        font-size: 1.625rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.2;
        margin-bottom: 0.5rem;
        min-height: 32px;
        display: flex;
        align-items: center;
      }

      .kpi-status {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--success);
        min-height: 18px;
      }

      .kpi-status.neutral {
        color: var(--text-secondary);
      }

      .kpi-status.warning {
        color: var(--warning);
      }

      .kpi-icon-wrap {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-left: 1rem;
      }

      .icon-sales {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .icon-users {
        background: #e0e7ff;
        color: #4338ca;
      }
      .icon-products {
        background: #fef3c7;
        color: #b45309;
      }
      .icon-orders {
        background: #dcfce7;
        color: #15803d;
      }

      /* Content Layout */
      .dashboard-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1.5rem;
      }

      @media (max-width: 960px) {
        .dashboard-layout {
          grid-template-columns: 1fr;
        }
      }

      /* Quick Shortcuts Grid */
      .quick-actions-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      .action-btn {
        background: #f8fafc;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 1rem 0.75rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
        color: var(--text-secondary);
        font-size: 0.8125rem;
        font-weight: 600;
        transition: all var(--transition-fast);
        cursor: pointer;
      }

      .action-btn:hover {
        background: #ffffff;
        border-color: var(--primary);
        color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.1);
      }

      .action-btn svg {
        width: 24px;
        height: 24px;
      }

      /* System Status List */
      .system-info-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        font-size: 0.8125rem;
      }

      .system-info-item {
        display: flex;
        justify-content: space-between;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-light);
        color: var(--text-secondary);
      }

      .system-info-item span:last-child {
        font-weight: 600;
        color: var(--text-main);
      }
    </style>
  </head>
  <body>
    <!-- Header / Topbar tự động render từ common.js -->
    <header id="appNavbar" data-active="dashboard"></header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Trang chủ Quản trị</h1>
          <p class="page-subtitle">
            Tổng quan số liệu kinh doanh & hoạt động hệ thống StoreHub
          </p>
        </div>
        <div class="header-controls">
          <button class="btn btn-secondary btn-sm" id="btnRefresh">
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
              />
            </svg>
            Làm mới dữ liệu
          </button>
        </div>
      </div>

      <!-- 4 KPI Cards với Lazy Load Skeleton ban đầu -->
      <div class="kpi-grid">
        <!-- 1. Doanh số -->
        <div class="kpi-card" id="cardSales">
          <div class="kpi-info">
            <div class="kpi-title">Doanh số</div>
            <div class="kpi-value" id="valSales">
              <span
                class="skeleton-box"
                style="width: 140px; height: 26px"
              ></span>
            </div>
            <div class="kpi-status" id="statusSales">
              <span
                class="skeleton-box"
                style="width: 150px; height: 14px"
              ></span>
            </div>
          </div>
          <div class="kpi-icon-wrap icon-sales">
            <svg
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </div>
        </div>

        <!-- 2. Người dùng đăng ký -->
        <div class="kpi-card" id="cardUsers">
          <div class="kpi-info">
            <div class="kpi-title">Người dùng đăng ký</div>
            <div class="kpi-value" id="valUsers">
              <span
                class="skeleton-box"
                style="width: 70px; height: 26px"
              ></span>
            </div>
            <div class="kpi-status neutral" id="statusUsers">
              <span
                class="skeleton-box"
                style="width: 140px; height: 14px"
              ></span>
            </div>
          </div>
          <div class="kpi-icon-wrap icon-users">
            <svg
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
              />
            </svg>
          </div>
        </div>

        <!-- 3. Tổng số sản phẩm -->
        <div class="kpi-card" id="cardProducts">
          <div class="kpi-info">
            <div class="kpi-title">Tổng số sản phẩm</div>
            <div class="kpi-value" id="valProducts">
              <span
                class="skeleton-box"
                style="width: 70px; height: 26px"
              ></span>
            </div>
            <div class="kpi-status neutral" id="statusProducts">
              <span
                class="skeleton-box"
                style="width: 110px; height: 14px"
              ></span>
            </div>
          </div>
          <div class="kpi-icon-wrap icon-products">
            <svg
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
              />
            </svg>
          </div>
        </div>

        <!-- 4. Quản lý đơn hàng -->
        <div class="kpi-card" id="cardOrders">
          <div class="kpi-info">
            <div class="kpi-title">Quản lý đơn hàng</div>
            <div class="kpi-value" id="valOrders">
              <span
                class="skeleton-box"
                style="width: 80px; height: 26px"
              ></span>
            </div>
            <div class="kpi-status warning" id="statusOrders">
              <span
                class="skeleton-box"
                style="width: 160px; height: 14px"
              ></span>
            </div>
          </div>
          <div class="kpi-icon-wrap icon-orders">
            <svg
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
              />
            </svg>
          </div>
        </div>
      </div>

      <!-- Detail Layout -->
      <div class="dashboard-layout">
        <!-- Recent Orders List với Table Skeleton -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Đơn hàng mới nhất</h2>
            <span style="font-size: 0.75rem; color: var(--text-muted)"
              >Cập nhật theo thời gian thực</span
            >
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mã đơn</th>
                  <th>Khách hàng</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody">
                <tr>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 70px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 130px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 90px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 80px; height: 22px; border-radius: 9999px"
                    ></span>
                  </td>
                </tr>
                <tr>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 65px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 150px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 85px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 80px; height: 22px; border-radius: 9999px"
                    ></span>
                  </td>
                </tr>
                <tr>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 75px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 120px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 95px; height: 18px"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="skeleton-box"
                      style="width: 80px; height: 22px; border-radius: 9999px"
                    ></span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Quick Shortcuts & System Overview -->
        <div style="display: flex; flex-direction: column; gap: 1.25rem">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Thao tác nhanh</h2>
            </div>
            <div class="card-body" style="padding: 1.25rem">
              <div class="quick-actions-grid">
                <div class="action-btn" id="btnActionOrders">
                  <svg
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
                    />
                  </svg>
                  <span>Đơn hàng</span>
                </div>
                <div class="action-btn" id="btnActionProducts">
                  <svg
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
                    />
                  </svg>
                  <span>Sản phẩm</span>
                </div>
                <div class="action-btn" id="btnActionUsers">
                  <svg
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                    />
                  </svg>
                  <span>Khách hàng</span>
                </div>
                <div class="action-btn" id="btnActionNews">
                  <svg
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                    />
                  </svg>
                  <span>Bài viết</span>
                </div>
              </div>
            </div>
          </div>

          <!-- <div class="card">
            <div class="card-header">
              <h2 class="card-title">Trạng thái hệ thống</h2>
            </div>
            <div class="card-body" style="padding: 1.25rem">
              <div class="system-info-list">
                <div class="system-info-item">
                  <span>Phiên bản quản trị:</span>
                  <span>v1.0.0 Web Admin</span>
                </div>
                <div class="system-info-item">
                  <span>Đồng bộ App:</span>
                  <span style="color: var(--success)"
                    >Tương thích Android FE</span
                  >
                </div>
                <div class="system-info-item">
                  <span>Máy chủ API:</span>
                  <span id="serverStatusText">Đang kết nối...</span>
                </div>
              </div>
            </div>
          </div> -->
        </div>
      </div>
    </main>

    <!-- Nạp JS chung trước JS của dashboard -->
    <script src="../common/common.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
