<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoreHub Admin - Quản lý Người dùng</title>
    <meta
      name="description"
      content="Quản lý danh sách khách hàng và nhân viên trên hệ thống StoreHub"
    />
    <link rel="stylesheet" href="../common/common.css" />
    <style>
      .user-cell {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .user-cell-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        background: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.875rem;
        color: var(--text-secondary);
        flex-shrink: 0;
      }

      .user-cell-info {
        display: flex;
        flex-direction: column;
      }

      .user-cell-name {
        font-weight: 600;
        color: var(--text-main);
        font-size: 0.875rem;
      }

      .user-cell-email {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .role-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.625rem;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .role-superadmin {
        background: #fef3c7;
        color: #92400e;
      }

      .role-admin {
        background: var(--primary-light);
        color: var(--primary);
      }

      .role-customer {
        background: #f1f5f9;
        color: var(--text-secondary);
      }

      .pagination-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--border-light);
        font-size: 0.8125rem;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .pagination-controls {
        display: flex;
        gap: 0.375rem;
      }

      .page-btn {
        min-width: 32px;
        height: 32px;
        padding: 0 0.5rem;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all var(--transition-fast);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .page-btn:hover:not(:disabled) {
        background: #f8fafc;
        color: var(--text-main);
        border-color: var(--card-border-hover);
      }

      .page-btn.active {
        background: var(--primary);
        color: #ffffff;
        border-color: var(--primary);
      }

      .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--text-muted);
      }

      .empty-state svg {
        width: 48px;
        height: 48px;
        margin-bottom: 1rem;
        opacity: 0.4;
      }

      .empty-state p {
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }

      @media (max-width: 768px) {
        .page-header-actions {
          width: 100%;
          flex-direction: column;
        }

        .search-box {
          width: 100%;
        }

        .data-table th:nth-child(2),
        .data-table td:nth-child(2),
        .data-table th:nth-child(4),
        .data-table td:nth-child(4) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Topbar Navigation -->
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-logo">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
        <span class="brand-name">StoreHub</span>
      </div>

      <nav class="topbar-nav" id="topbarNav" data-active="users"></nav>

      <div class="topbar-user">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-meta">
          <span class="user-name" id="userName">Admin</span>
          <span class="user-role" id="userRole">Quản trị viên</span>
        </div>
        <button class="btn-logout" id="btnLogout" title="Đăng xuất">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h2 class="page-title">Quản lý Người dùng</h2>
          <p class="page-subtitle">Danh sách tài khoản khách hàng và nhân viên trong hệ thống</p>
        </div>
        <div class="page-header-actions">
          <div class="search-box">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" id="searchInput" placeholder="Tìm theo tên, email..." />
          </div>
          <button class="btn btn-primary" id="btnAddUser">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; margin-right: 6px">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Thêm người dùng
          </button>
        </div>
      </div>

      <!-- Table Card -->
      <div class="card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Người dùng</th>
                <th>Số điện thoại</th>
                <th>Vai trò</th>
                <th>Ngày tạo</th>
                <th style="text-align: right">Thao tác</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <!-- Skeleton rows rendered by JS -->
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-bar" id="paginationBar">
          <span id="paginationInfo">Đang tải...</span>
          <div class="pagination-controls" id="paginationControls"></div>
        </div>
      </div>
    </main>

    <script src="../common/common.js"></script>
    <script src="users.js"></script>
  </body>
</html>
