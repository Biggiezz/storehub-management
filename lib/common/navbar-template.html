<!-- ==========================================================================
     StoreHub Management - Navbar Template (Topbar Header Chuẩn)
     
     HƯỚNG DẪN DÙNG CHO CÁC THÀNH VIÊN:
     --------------------------------------------------------------------------
     CÁCH 1 (Khuyên dùng - Nhanh & Tự động 100%):
     Chỉ cần đặt thẻ header sau ở đầu thẻ <body> trong file HTML của bạn:
     
     <header id="appNavbar" data-active="orders"></header>
     (Trong đó data-active có thể là: 'dashboard' | 'orders' | 'products' | 'users' | 'news')
     File common.js sẽ tự động render đầy đủ menu, thông tin Admin và gắn nút đăng xuất!

     CÁCH 2 (Copy-paste trực tiếp vào HTML nếu muốn tùy biến):
     Sử dụng đoạn mã bên dưới và nạp common.css + common.js.
     ========================================================================== -->

<header class="topbar" id="appNavbar">
  <!-- Brand Logo & Main Navigation -->
  <div style="display: flex; align-items: center;">
    <a href="../dashboard/dashboard.html" class="brand-section">
      <div class="brand-logo">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <span class="brand-text">StoreHub</span>
      <span class="brand-tag">Quản trị</span>
    </a>

    <!-- Menu điều hướng các phân hệ -->
    <nav class="topbar-nav">
      <a href="../dashboard/dashboard.html" class="nav-link-item" id="navDashboard">Trang chủ</a>
      <a href="../orders/orders.html" class="nav-link-item" id="navOrders">Đơn hàng</a>
      <a href="../products/products.html" class="nav-link-item" id="navProducts">Sản phẩm</a>
      <a href="../users/customers.html" class="nav-link-item" id="navUsers">Khách hàng</a>
      <a href="../news/news.html" class="nav-link-item" id="navNews">Bài viết</a>
    </nav>
  </div>

  <!-- Thông tin Quản trị viên & Đăng xuất -->
  <div class="topbar-actions">
    <div class="user-pill" id="userPill">
      <div class="user-avatar" id="avatarText">A</div>
      <div class="user-info">
        <span class="user-name" id="adminName">Admin</span>
        <span class="user-role-badge" id="adminRole">Quản trị viên</span>
      </div>
    </div>
    <button class="btn-header btn-logout" id="btnLogout" title="Đăng xuất khỏi hệ thống">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Đăng xuất</span>
    </button>
  </div>
</header>
